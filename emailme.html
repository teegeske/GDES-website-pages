<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Me!</title>
    <link rel="icon" type="image/x-icon" href="img/TGFavicon.png">
    <meta name="description" content="Email Tyler Geske here!">
    <link href="id-style.css" rel="stylesheet" type="text/css" media="all">

</head>
<body>
<div class="leftnav">
    <div class="homecirc">
        <a href="https://teegoobo.com">
            <div class="myheadnav"></div>
        </a>
    </div>
    <section class="navbuttons">
        <a href="https://teegoobo.com/about">
            <div class="abtbut"></div>
        </a>
        <a href="https://teegeske.github.io/GDES-website-pages/gallery.html">
            <div class="galicon"></div>
        </a>
        <a href="https://teegoobo.com/linkpage">
            <div class="linkicon"></div>
        </a>
        <a href="https://teegoobo.com/site_updates">
            <div class="updicon"></div>
        </a>
        <a href="https://teegeske.github.io/GDES-website-pages/emailme.html">
            <div class="emmeicon"></div>
        </a>
    </section>
</div>
<div id="parent">
    <section class="main-content-area">
        <section class="topfiller"></section>
        <section class="titlebox">
            <section class="mr-title"><img src="img/assets/emailhead.png" alt="Email Me!" style="height:7vw;"></section>
        </section>
        <section class="emailarea">
            <section class="mr-email">
                <form>
                    <div class="forumcol">
                        <div>
                            <div>
                                <div class="inputbox" style="min-height: 55px;">
                                    <input type="text" id="name" name="address" placeholder="your name">
                                    <input type="text" id="address" name="address" placeholder="your email address">
                                    <input type="text" id="subject" name="address" placeholder="subject for email">
                                    <textarea id="message" name="message"
                                              placeholder="Type your message here!"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="formrow">
                        <input type="button" value="submit">
                    </div>
                </form>
            </section>
        </section>
    </section>
    <section class="footer">
        <section class="copyright"></section>
    </section>
</div>
</body>
</html>
